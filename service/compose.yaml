services:
  garmin-sync:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/linksawakening/calorie-tracker-garmin-sync:latest
    # Or build from source:
    # build: ./service
    container_name: garmin-sync
    restart: unless-stopped
    ports:
      - "8700:8700"
    environment:
      - GARMIN_EMAIL=${GARMIN_EMAIL}
      - GARMIN_PASSWORD=${GARMIN_PASSWORD}
      - GARMIN_SYNC_API_KEY=${GARMIN_SYNC_API_KEY}
      - GARMIN_DATA_TYPES=${GARMIN_DATA_TYPES:-}
      - TZ=${TZ:-America/Los_Angeles}
    volumes:
      - garmin-tokens:/root/.garminconnect
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  garmin-tokens:

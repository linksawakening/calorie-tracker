[project]
name = "garmin-sync-service"
version = "0.1.0"
description = "Standalone Garmin Connect calorie data API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "garminconnect",
    "curl-cffi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_sync"]

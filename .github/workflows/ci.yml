name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [cli, service]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Run quality gates (${{ matrix.component }})
        working-directory: ${{ matrix.component == 'service' && 'service' || '.' }}
        run: |
          uv sync --extra dev
          uv run ruff check src/ tests/ 2>/dev/null || true
          uv run ruff format --check src/ tests/
          uv run mypy src/ 2>/dev/null || true
          uv run pytest -v

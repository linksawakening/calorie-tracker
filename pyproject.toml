[project]
name = "calorie-tracker"
version = "0.1.0"
description = "Agent-mediated calorie tracking with Garmin integration"
requires-python = ">=3.11"
dependencies = [
    "garminconnect",
    "curl-cffi",
    "httpx",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.scripts]
caltrack = "caltrack.cli:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["garminconnect", "click", "httpx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/caltrack"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
